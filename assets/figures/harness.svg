<polygon points="802,450 792.0950818741205,454.78462087522354 792.0950818741205,445.21537912477646" fill="#526773"/>
<rect x="28" y="552" width="250" height="96" rx="10" fill="#F3F6F7" stroke="#D5DFE3"/>
<text x="46" y="585" font-size="23" fill="#172D39">轨迹归因</text>
<text x="46" y="617" font-size="19" fill="#526773">定位偏差与可改位置</text>
<polyline points="278,599 326,599" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="326,599 316.0950818741206,603.7846208752235 316.0950818741206,594.2153791247765" fill="#526773"/>
<rect x="326" y="552" width="250" height="96" rx="10" fill="#F3F6F7" stroke="#D5DFE3"/>
<text x="344" y="585" font-size="23" fill="#172D39">生成候选</text>
<text x="344" y="617" font-size="19" fill="#526773">修改插件及组合</text>
<polyline points="576,599 624,599" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="624,599 614.0950818741205,603.7846208752235 614.0950818741205,594.2153791247765" fill="#526773"/>
<rect x="624" y="552" width="250" height="96" rx="10" fill="#F3F6F7" stroke="#D5DFE3"/>
<text x="642" y="585" font-size="23" fill="#172D39">配对评测</text>
<text x="642" y="617" font-size="19" fill="#526773">检查修复与退步</text>
<polyline points="874,599 922,599" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="922,599 912.0950818741205,603.7846208752235 912.0950818741205,594.2153791247765" fill="#526773"/>
<rect x="922" y="552" width="250" height="96" rx="10" fill="#F3F6F7" stroke="#D5DFE3"/>
<text x="940" y="585" font-size="23" fill="#172D39">选择与反馈</text>
<text x="940" y="617" font-size="19" fill="#526773">采用或保留父版</text>
<text x="28" y="682" font-size="19" fill="#526773">修改空间更大，代表可表达的机制更多；能否找到好机制，还取决于优化器和预算。</text>
</svg>