<polygon points="997,306 992.2153791247765,296.0950818741206 1001.7846208752235,296.0950818741206" fill="#526773"/>
<polyline points="822,378 775,378" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="775,378 784.9049181258795,373.21537912477646 784.9049181258795,382.78462087522354" fill="#526773"/>
<polyline points="425,378 378,378" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="378,378 387.9049181258794,373.21537912477646 387.9049181258794,382.78462087522354" fill="#526773"/>
<rect x="28" y="488" width="1144" height="149" rx="12" fill="#EBF2F9" stroke="#D5DFE3"/>
<text x="50" y="525" font-size="23" fill="#275F91">一条训练样本保留“当时看到什么”与“应该采取什么动作”</text>
<text x="50" y="562" font-size="21" fill="#172D39">已发生的上下文</text>
<text x="50" y="593" font-size="18" fill="#526773">用户确认分院、工具查到可约</text>
<text x="433" y="562" font-size="21" fill="#172D39">目标模型调用</text>
<text x="433" y="593" font-size="18" fill="#526773">调用预约工具，或给出正确回复</text>
<text x="816" y="562" font-size="21" fill="#172D39">训练监督</text>
<text x="816" y="593" font-size="18" fill="#526773">此前上下文不计损失</text>
<text x="816" y="618" font-size="18" fill="#526773">当前目标 assistant 输出计损失</text>
<polyline points="373,576 407,576" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="407,576 397.0950818741206,580.7846208752235 397.0950818741206,571.2153791247765" fill="#526773"/>
<polyline points="763,576 796,576" fill="none" stroke="#526773" stroke-width="2"/>
<polygon points="796,576 786.0950818741205,580.7846208752235 786.0950818741205,571.2153791247765" fill="#526773"/>
<text x="28" y="675" font-size="20" fill="#267765">运行锚点：美年第二轮训练与复评完成；86.35% → 87.67% 为循环内指标。</text>
</svg>